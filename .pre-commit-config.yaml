repos:
  - repo: local
    hooks:
      # Run Ruff linter from the local virtualenv to ensure version consistency
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      # Run Ruff formatter from the local virtualenv to ensure version consistency
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      # Run Mypy static type checker from local virtualenv
      - id: mypy
        name: mypy
        entry: uv run mypy lughus
        language: system
        types: [python]
        pass_filenames: false

      # Run Pytest suite from local virtualenv
      - id: pytest
        name: pytest
        entry: uv run pytest tests/ -q --cov=lughus --cov-branch --cov-fail-under=85
        language: system
        pass_filenames: false

