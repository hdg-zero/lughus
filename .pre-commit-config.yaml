repos:
  - repo: local
    hooks:
      # Run Ruff linter from the local virtualenv to ensure version consistency
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      # Run Ruff formatter from the local virtualenv to ensure version consistency
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      # Run Mypy static type checker from local virtualenv
      - id: mypy
        name: mypy
        entry: uv run mypy lughus
        language: system
        types: [python]
        pass_filenames: false

      # W1-10: fast subset only. The full suite with coverage runs in CI.
      # A pre-commit hook slow enough to be bypassed with --no-verify protects nothing.
      - id: pytest-fast
        name: pytest (fast subset)
        entry: uv run pytest tests/ -q -x -m "not slow and not integration" -p no:cacheprovider
        language: system
        pass_filenames: false

