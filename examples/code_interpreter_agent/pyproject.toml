[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code_interpreter_agent"
version = "0.22.0"
description = "Lughus Sandboxed Data Scientist & Code Interpreter Agent (OCI Confinement)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lughus[server]>=0.22.0,<0.23.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.2",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
code_interpreter_agent = "code_interpreter_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["code_interpreter_agent*"]

[tool.setuptools.package-data]
code_interpreter_agent = ["py.typed"]
