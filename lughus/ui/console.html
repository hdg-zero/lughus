<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__AGENT_NAME__ — Lughus Developer Console</title>
  <script>
    (function() {
      const saved = localStorage.getItem("lughus_ui_theme");
      const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      document.documentElement.dataset.theme = (saved === "light" || saved === "dark") ? saved : (prefersLight ? "light" : "dark");
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/ui/assets/logo.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="stylesheet" href="/ui/assets/console.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="app-viewport">
    <!-- Top Status Bar -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-container">
          <img class="lughus-mark" src="/ui/assets/logo.svg" alt="Lughus Logo" width="36" height="36">
        </div>
        <div class="brand-info">
          <div class="brand-title-row"><h1>__AGENT_NAME__</h1><span class="lughus-signature">LUGHUS</span></div>
          <span class="agent-desc">__AGENT_DESCRIPTION__</span>
        </div>
      </div>

      <div class="header-right">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light theme">
          <span class="theme-icon" aria-hidden="true">☀</span>
          <span class="theme-label">Light</span>
        </button>
        <div class="status-badge">
          <span id="status-indicator" class="status-dot"></span>
          <span id="status" class="status-text">idle</span>
        </div>
      </div>
    </header>

    <!-- Main Viewport Split -->
    <div class="workspace">
      <!-- Left Sidebar: Controls & History -->
      <aside class="sidebar">
        <!-- Objective & Files Form -->
        <section class="sidebar-section form-section">
          <form id="form">
            <div class="field-group">
              <label for="objective">Objective</label>
              <textarea id="objective" name="objective" autofocus placeholder="Enter agent objective or instructions... (Ctrl+Enter to run)"></textarea>
            </div>
            
            <div class="field-group margin-top">
              <label for="files">Attached Files</label>
              <div class="file-dropzone">
                <input id="files" name="files" type="file" multiple>
                <div class="dropzone-text">Drop files or click to attach</div>
              </div>
              <div class="file-meta">
                <span id="file-count" class="meta">0 files attached</span>
              </div>
            </div>
            
            <div class="actions">
              <button id="run" type="submit" class="btn-primary">Run Agent</button>
              <button id="cancel" type="button" class="btn-danger" disabled>Cancel</button>
            </div>
          </form>
        </section>

        <!-- Execution History -->
        <section class="sidebar-section history-section">
          <div class="section-header">
            <h3>Execution History</h3>
            <button id="clear-history" class="btn-text" title="Clear History">Clear</button>
          </div>
          <div id="run-list" class="run-list">
            <div class="empty-history">No runs in this session</div>
          </div>
        </section>
      </aside>

      <!-- Right Main Workspace: Events & Outputs -->
      <main class="console-viewport">
        <div class="console-header">
          <div class="console-title">
            <h2>Event Stream</h2>
            <input id="event-search" type="search" placeholder="Search logs..." class="search-input">
            <button id="toggle-markdown" class="md-toggle-btn" title="Toggle Markdown rendering">Markdown: Off</button>
          </div>
          <div id="event-filters" class="event-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="progress">Progress</button>
            <button class="filter-btn" data-filter="tool">Tools</button>
            <button class="filter-btn" data-filter="a2a">A2A</button>
            <button class="filter-btn" data-filter="telemetry">Telemetry</button>
            <button class="filter-btn" data-filter="error">Errors</button>
          </div>
        </div>

        <section class="agent-flow" id="agent-flow" aria-labelledby="agent-flow-title">
          <div class="agent-flow-heading">
            <h2 id="agent-flow-title">Agent Path</h2>
            <span id="agent-flow-detail" class="agent-flow-detail">Waiting for a run</span>
          </div>
          <div id="agent-flow-steps" class="agent-flow-steps" role="list"></div>
        </section>

        <div class="running-watermark" aria-hidden="true">
          <img class="watermark-logo" src="/ui/assets/logo.svg" alt="" width="720" height="720">
        </div>

        <div class="events-stream" id="events">
          <div class="empty">Execute the agent to see real-time logs and output artifacts here</div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/ui/assets/console.js"></script>
</body>
</html>
