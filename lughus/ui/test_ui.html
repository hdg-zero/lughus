<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__AGENT_NAME__ — Lughus Debug Console</title>
  <link rel="stylesheet" href="/ui/assets/test_ui.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-viewport">
    <!-- Top Status Bar -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-container">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div class="brand-info">
          <h1>__AGENT_NAME__</h1>
          <span class="agent-desc">__AGENT_DESCRIPTION__</span>
        </div>
      </div>

      <div class="header-right">
        <div class="status-badge">
          <span id="status-indicator" class="status-dot"></span>
          <span id="status" class="status-text">idle</span>
        </div>
      </div>
    </header>

    <!-- Main Viewport Split -->
    <div class="workspace">
      <!-- Left Sidebar: Controls & History -->
      <aside class="sidebar">
        <!-- Objective & Files Form -->
        <section class="sidebar-section form-section">
          <form id="form">
            <div class="field-group">
              <label for="objective">Objective</label>
              <textarea id="objective" name="objective" autofocus placeholder="Explain what the agent should accomplish...">Analyze the provided dataset, compute statistics, generate charts, and produce the report.</textarea>
            </div>
            
            <div class="field-group margin-top">
              <label for="files">Attached Files</label>
              <div class="file-dropzone">
                <input id="files" name="files" type="file" multiple>
                <div class="dropzone-text">Click or drag dataset files (.csv, .xlsx)</div>
              </div>
              <div class="file-meta">
                <span id="file-count" class="meta">0 files attached</span>
              </div>
            </div>
            
            <div class="actions">
              <button id="run" type="submit" class="btn-primary">Run Agent</button>
              <button id="cancel" type="button" class="btn-danger" disabled>Cancel</button>
            </div>
          </form>
        </section>

        <!-- Execution History -->
        <section class="sidebar-section history-section">
          <div class="section-header">
            <h3>Execution History</h3>
            <button id="clear-history" class="btn-text" title="Clear History">Clear</button>
          </div>
          <div id="run-list" class="run-list">
            <div class="empty-history">No runs in this session</div>
          </div>
        </section>

        <!-- OpenTelemetry Accordion -->
        <details class="sidebar-section otel-section">
          <summary class="otel-summary">OpenTelemetry Traces</summary>
          <form id="otel-form" class="otel-form">
            <div class="otel-input-group">
              <input id="otel-url" name="otel-url" type="url" placeholder="http://localhost:16686/api/traces/{trace_id}">
              <button id="load-otel" type="submit" class="btn-secondary">Load</button>
            </div>
            <pre id="otel-output">No trace query yet</pre>
          </form>
        </details>
      </aside>

      <!-- Right Main Workspace: Events & Outputs -->
      <main class="console-viewport">
        <div class="console-header">
          <div class="console-title">
            <h2>Event Stream</h2>
            <input id="event-search" type="search" placeholder="Search logs..." class="search-input">
            <button id="toggle-markdown" class="md-toggle-btn" title="Toggle Markdown rendering">Markdown: Off</button>
          </div>
          <div id="event-filters" class="event-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="progress">Progress</button>
            <button class="filter-btn" data-filter="tool">Tools</button>
            <button class="filter-btn" data-filter="telemetry">Telemetry</button>
            <button class="filter-btn" data-filter="error">Errors</button>
          </div>
        </div>

        <div class="events-stream" id="events">
          <div class="empty">Execute the agent to see real-time logs and output artifacts here</div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/ui/assets/test_ui.js"></script>
</body>
</html>
