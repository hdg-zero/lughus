[project]
name = "lughus"
version = "0.15.0"
description = "Micro-framework for building A2A agents with LiteLLM — agent loop, tool registry, A2A gateway."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "hdg-zero" },
]
keywords = ["agent", "a2a", "llm", "litellm", "agentic", "tool-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "litellm>=1.0,<2.0",
    "python-dotenv",
    "jsonschema>=4.0",
    # The OTel *API* is a base dependency, not an extra: lughus.loop, lughus.llm
    # and lughus.telemetry create tracers and counters at import time. Without an
    # SDK it is a no-op with a negligible footprint, which is precisely what the
    # OTel project designs the API package for. The SDK stays in the otel extra.
    "opentelemetry-api>=1.20",
]

[project.urls]
Homepage = "https://github.com/hdg-zero/lughus"
Repository = "https://github.com/hdg-zero/lughus"
Issues = "https://github.com/hdg-zero/lughus/issues"
Changelog = "https://github.com/hdg-zero/lughus/blob/main/CHANGELOG.md"

[project.scripts]
lughus = "lughus.interfaces.cli:main"

[tool.setuptools.packages.find]
include = ["lughus*"]
exclude = ["scratch*", "tests*", "examples*"]

[tool.setuptools.package-data]
lughus = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/*.svg"]

[project.optional-dependencies]
server = [
    "a2a-sdk>=0.3.0,<1.0",
    "fastapi",
    "uvicorn[standard]",
    "starlette",
    "sse-starlette",
]
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]
all = [
    "lughus[server,otel]",
]
dev = [
    "lughus[all]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
branch = true
source = ["lughus"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.mypy]
# must match the *lowest* supported interpreter declared in
# requires-python, otherwise 3.12-only constructs pass type checking and
# break at runtime on 3.11.
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "litellm.*"
ignore_missing_imports = true
no_implicit_reexport = false

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
