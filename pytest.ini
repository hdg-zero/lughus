[pytest]
asyncio_mode = auto
# Explicit fixture loop scope: Lughus binds an ExecutionRuntime to a specific
# event loop (see lughus/runtime.py::_bind), so the loop lifetime matters.
asyncio_default_fixture_loop_scope = function
pythonpath = .
addopts =
    --import-mode=importlib
    --strict-markers
    --strict-config
# W1-10: warnings are errors. A masked DeprecationWarning is a future breakage.
# Exceptions are granted by name, never wholesale, and each carries a review date.
filterwarnings =
    error
    # litellm emits deprecation warnings from its own dependencies; not ours to fix.
    # Review: 2026-12-31
    default::DeprecationWarning:litellm.*
    default::DeprecationWarning:pydantic.*
    default::DeprecationWarning:httpx.*
markers =
    extra_server: requires the 'server' extra (a2a-sdk, starlette, uvicorn)
    extra_otel: requires the 'otel' extra (opentelemetry-sdk)
    extra_all: requires every optional extra
    integration: end-to-end test crossing several components
    contract: contract suite applicable to every implementation of a protocol
    slow: takes more than one second
