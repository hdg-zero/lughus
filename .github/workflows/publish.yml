name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # W1-09 / N-06: the previous workflow rebuilt and published without running a
  # single test. Publication to PyPI is irreversible -- a deleted version can never
  # be republished under the same number -- so verification comes first, and it
  # reuses ci.yml rather than duplicating its steps.
  verify:
    name: Full verification
    uses: ./.github/workflows/ci.yml

  guard:
    name: Assert the release tag matches the project version
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Compare tag and pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["TAG"].removeprefix("v")
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if tag != version:
              raise SystemExit(
                  f"release tag {tag!r} does not match project version {version!r}; "
                  "refusing to publish"
              )
          print("tag/version consistent:", version)
          PY

  publish:
    name: Publish to PyPI
    needs: [verify, guard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The protected environment is what makes the OIDC token reviewable. Configure
    # `pypi` in the repository settings with required reviewers -- that part cannot
    # live in this file (see docs/guides/release.md).
    environment:
      name: pypi
      url: https://pypi.org/p/lughus
    permissions:
      id-token: write  # Mandatory for OIDC trusted publishing
      contents: read

    steps:
      - name: Download the artefact verified by CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        # Pinned by commit SHA like every other action in this repository. The
        # previous `@release/v1` was a mutable ref: the code that published the
        # package was unknown at review time.
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc  # v1.12.4
        with:
          attestations: true
