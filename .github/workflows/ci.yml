name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # W1-09: publish.yml reuses this workflow so that "verified" has exactly one
  # definition. Two divergent definitions eventually produce an unverified release.
  workflow_call:

# Cancel superseded runs on the same ref: a queued CI is a CI nobody waits for.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test and Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v5.3.1
        with:
          enable-cache: true
          version: "0.11.16"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked

      - name: Assert the lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: Lint check (Ruff)
        run: uv run ruff check .

      - name: Format check (Ruff)
        run: uv run ruff format --check .

      - name: Type check (Mypy)
        run: uv run mypy lughus

      - name: Run tests
        run: uv run pytest tests/ -q --cov=lughus --cov-branch --cov-report=term-missing --cov-fail-under=85

  # ── W1-08 / N-07 ────────────────────────────────────────────────────────────
  # The three jobs below are the control that was missing: CI validated the source
  # tree inside its development environment, never the artefact that ships. That is
  # the direct root cause of N-01 (broken base install, green CI for releases).

  dist:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v5.3.1
        with:
          enable-cache: true
          version: "0.11.16"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: uv build

      - name: Validate distribution metadata
        run: uvx twine check dist/*

      - name: Assert the built version matches pyproject
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          names = sorted(p.name for p in pathlib.Path("dist").iterdir())
          assert any(f"lughus-{version}" in name for name in names), (version, names)
          print("version consistent:", version)
          PY

      - name: Assert the sdist ships py.typed and the UI assets
        run: |
          set -euo pipefail
          tar -tzf dist/*.tar.gz | grep -q 'lughus/py.typed'
          tar -tzf dist/*.tar.gz | grep -q 'lughus/ui/'
          echo "package data present"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  dist-core:
    name: Core-only install smoke test (Python ${{ matrix.python-version }})
    needs: dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the wheel with base dependencies only
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install dist/*.whl

      - name: Assert the optional extras really are absent
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util

          for module in ("a2a", "starlette", "fastapi", "uvicorn", "opentelemetry.sdk"):
              assert importlib.util.find_spec(module) is None, (
                  f"{module} must not be installed by the base package"
              )
          print("core-only environment confirmed")
          PY

      - name: Functional smoke test on the core
        run: |
          .venv/bin/python - <<'PY'
          import asyncio

          import lughus
          from lughus.testing import MockLLM

          registry = lughus.ToolRegistry()

          @registry.tool(
              "echo",
              "Echo a value back",
              {
                  "type": "object",
                  "properties": {"value": {"type": "string"}},
                  "required": ["value"],
                  "additionalProperties": False,
              },
          )
          def echo(*, state, value: str) -> str:
              return value


          async def main() -> None:
              llm = MockLLM(
                  [
                      [{"name": "echo", "arguments": {"value": "hi"}, "id": "c1"}],
                      "done",
                  ]
              )
              result = await lughus.agent_loop(
                  llm,
                  system="You are a test agent.",
                  context="Echo hi.",
                  registry=registry,
                  tool_names=["echo"],
              )
              assert str(result) == "done", result
              assert result.iterations == 2, result.iterations


          asyncio.run(main())
          print("core smoke test OK, lughus", lughus.__version__)
          PY

      - name: Assert the optional surface fails with an actionable message
        run: |
          .venv/bin/python - <<'PY'
          import lughus

          for name in ("BaseGateway", "build_app", "serve"):
              try:
                  getattr(lughus, name)
              except ImportError as exc:
                  assert "lughus[server]" in str(exc), (name, str(exc))
              else:
                  raise AssertionError(f"lughus.{name} should have raised ImportError")

          try:
              lughus.setup_telemetry("svc")
          except ImportError as exc:
              assert "lughus[otel]" in str(exc), str(exc)
          else:
              raise AssertionError("setup_telemetry() should have raised ImportError")

          print("optional surface OK")
          PY

  extras:
    name: Extra '${{ matrix.extra }}'
    needs: dist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        extra: ["server", "otel", "all"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download dist artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the wheel with the '${{ matrix.extra }}' extra
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "$(echo dist/*.whl)[${{ matrix.extra }}]"
          .venv/bin/pip install pytest pytest-asyncio pytest-mock

      - name: Run the tests relevant to this extra
        # Tests requiring another extra are excluded by marker. `not extra` selects
        # every test that declares no extra_* marker at all.
        run: |
          .venv/bin/python -m pytest tests/ -q \
            -m "extra_${{ matrix.extra }} or not (extra_server or extra_otel or extra_all)" \
            --no-header

  gate:
    name: All required checks passed
    needs: [test, dist, dist-core, extras]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        run: echo "test, dist, dist-core and extras are green."
