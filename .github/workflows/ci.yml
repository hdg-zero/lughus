name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v5.3.1
        with:
          enable-cache: true
          version: "0.11.16"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked

      - name: Lint check (Ruff)
        run: uv run ruff check .

      - name: Format check (Ruff)
        run: uv run ruff format --check .

      - name: Type check (Mypy)
        run: uv run mypy lughus

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run tests
        run: uv run pytest tests/ -q --cov=lughus --cov-branch --cov-report=term-missing --cov-fail-under=85 --junitxml=reports/junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: junit-py${{ matrix.python-version }}
          path: reports/junit.xml

      - name: Collect gate (reject collection errors)
        if: always()
        run: |
          if [ -f reports/junit.xml ]; then
            errors=$(python -c "
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse('reports/junit.xml')
          root = tree.getroot()
          total = 0
          for s in root.iter('testsuite'):
              total += int(s.get('errors', '0'))
          print(total)
          ")
            if [ "$errors" -gt 0 ]; then
              echo "::error::Collection errors detected ($errors). Fix import/syntax errors before merging."
              exit 1
            fi
            echo "Collect gate passed: 0 collection errors."
          else
            echo "::error::JUnit report not found -- test step may have crashed."
            exit 1
          fi

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v5.3.1
        with:
          enable-cache: true
          version: "0.11.16"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked

      - name: Run pip-audit
        run: uv export --no-hashes --no-dev -o requirements.txt && uvx pip-audit -r requirements.txt

  differential:
    name: Differential test check
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v5.3.1
        with:
          enable-cache: true
          version: "0.11.16"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Download head report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: junit-py3.12
          path: reports/head

      - name: Generate base branch report
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git checkout FETCH_HEAD -- . 2>/dev/null || true
          uv sync --all-extras --dev --locked
          mkdir -p reports/base
          uv run pytest tests/ -q --junitxml=reports/base/junit.xml || true
          git checkout ${{ github.sha }} -- .

      - name: Run differential comparison
        run: python scripts/diff_junit.py reports/base/junit.xml reports/head/junit.xml
